<style>
:root{--bl1:#3d8cff;--bl2:#1456e8}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#fff;color:#1b2a4a;font-family:"Fredoka",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;cursor:pointer}
#stage{position:fixed;left:50%;top:50%;width:1280px;height:720px;margin:-360px 0 0 -640px;transform-origin:50% 50%;overflow:hidden;background:radial-gradient(circle at 50% 50%,#fff 52%,#eaf2ff)}
#c{position:absolute;left:0;top:0;width:1280px;height:720px;touch-action:none}
.pill{display:flex;align-items:center;gap:14px;height:68px;padding:0 28px 0 10px;border-radius:99px;background:linear-gradient(var(--bl1),var(--bl2));color:#fff;font-weight:700;font-size:38px;box-shadow:0 8px 18px #1456e855,inset 0 3px 0 #ffffff66}
.pill .ic{width:48px;height:48px;border-radius:50%;background:#ffffff2b;display:flex;align-items:center;justify-content:center;font-size:28px}
.pill small{font-size:24px;letter-spacing:1px}
.pill em{font-style:normal;color:#ffe135}
#tl{position:absolute;left:40px;top:28px}
#tr{position:absolute;right:40px;top:28px;display:flex;gap:20px;align-items:center}
.pb{width:68px;height:68px;border-radius:50%;background:linear-gradient(var(--bl1),var(--bl2));box-shadow:0 8px 18px #1456e855,inset 0 3px 0 #ffffff66;color:#fff;font-size:26px;letter-spacing:-2px}
.pb:active,.cta:active,.opt:active{transform:translateY(4px)}
#msg{position:absolute;left:0;right:0;top:300px;text-align:center;font-size:72px;font-weight:700;pointer-events:none;text-shadow:0 4px 0 #fff,0 0 30px #fff}
#toast{position:absolute;top:112px;left:50%;transform:translateX(-50%);background:#1b2a4acc;color:#fff;padding:10px 26px;border-radius:99px;font-size:24px;transition:opacity .6s;pointer-events:none;white-space:nowrap}
#flags{position:absolute;left:40px;bottom:34px;display:grid;grid-template-columns:repeat(2,auto);gap:14px 20px}
.fl{display:flex;flex-direction:column;align-items:center;gap:6px}
.fl img{width:68px;height:68px;border-radius:50%;border:6px solid var(--c);box-sizing:content-box;box-shadow:0 6px 14px color-mix(in srgb,var(--c) 55%,transparent)}
.fl i{display:block;width:60px;height:7px;border-radius:9px;background:#e3e8f5;overflow:hidden}
.fl i b{display:block;height:100%;transition:width .2s}
.fl u{text-decoration:none;font-size:18px;font-weight:700;color:var(--c);line-height:1}
.fl.me img{transform:scale(1.12);outline:4px dashed var(--c);outline-offset:4px}
.fl.dead{opacity:.3;filter:grayscale(1)}
#joy{position:absolute;right:44px;bottom:34px;width:200px;height:200px;border-radius:50%;touch-action:none;background:radial-gradient(circle at 50% 35%,#fff,#dde6fb);border:6px solid #cdd8f5;box-shadow:0 12px 26px #1456e833,inset 0 -6px 12px #1456e822;display:flex;align-items:center;justify-content:center}
#joy s{position:absolute;color:#2f6bff;font-size:20px;text-decoration:none}
#knob{width:86px;height:86px;border-radius:50%;background:radial-gradient(circle at 40% 30%,#6fb0ff,#1456e8);box-shadow:0 8px 16px #1456e866}
.ov{position:absolute;inset:0;transition:opacity .3s,transform .3s}
.ov.hide{opacity:0;pointer-events:none}
#pausebox{z-index:4;background:#ffffffe6;backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#pausebox h2{margin:0 0 6px;font-size:56px}
.cta{width:420px;padding:14px;border-radius:30px;font-size:34px;font-weight:700;color:#fff;background:linear-gradient(#45e883,#17b95b);box-shadow:0 8px 0 #0b7d3b,0 16px 28px #17b95b55}
.opt{width:420px;padding:12px;border-radius:26px;font-size:26px;font-weight:600;background:#fff;border:3px solid #cdd8f5;box-shadow:0 6px 0 #cdd8f5}
.cta:disabled{filter:grayscale(1);opacity:.5}
#home{z-index:5;display:flex;align-items:center;justify-content:space-around;padding:0 36px;background:radial-gradient(circle at 70% 50%,#fff 40%,#e6f0ff)}
#home.hide{transform:scale(1.05)}
.hl{display:flex;flex-direction:column;align-items:center;gap:16px}
.hl h1{margin:0;font-size:84px;line-height:.95;text-align:center;font-weight:700;background:linear-gradient(90deg,#22d3ee,#2f6bff,#ff4fd8,#ffb300);-webkit-background-clip:text;background-clip:text;color:transparent}
.hl p{margin:0 0 14px;font-size:26px;color:#5a6a8f;max-width:380px;text-align:center}
.hl .opt{width:380px;white-space:nowrap;font-size:24px}
.ow{position:relative;width:330px;height:330px}
#modes{display:flex;gap:26px}
.mw{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;transition:transform .15s,opacity .2s}
.mw:active{transform:scale(.96)}
#msc{z-index:5;display:flex;align-items:center;justify-content:center;gap:56px;padding:0 50px;background:radial-gradient(circle at 70% 50%,#fff 40%,#e6f0ff)}
#msc.hide{transform:scale(.96)}
.mpv{width:540px;padding:14px;gap:9px;border-radius:38px;border:4px solid var(--b);background:linear-gradient(#fff,var(--t));box-shadow:0 10px 0 var(--bs),0 24px 40px var(--sh);display:flex;flex-direction:column;align-items:center}
.mcol{display:flex;flex-direction:column;align-items:center;gap:16px;width:420px}
.mfl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:62px;align-items:center}
.mfl img{width:46px;height:46px;border-radius:50%;border:5px solid var(--c);box-sizing:content-box;box-shadow:0 4px 10px color-mix(in srgb,var(--c) 45%,transparent)}
#mplay{width:420px;text-align:center;font-size:40px;padding:14px 0;cursor:pointer}
#mplay:active{transform:translateY(5px)}
#mplay.off{opacity:.45;pointer-events:none;filter:grayscale(1)}
#msc .opt{font-size:30px;padding:16px}
.mw>small{font-size:21px;color:#5a6a8f;font-weight:500}
.cap{padding:8px 30px;border-radius:26px;background:var(--c);color:#fff;font-size:30px;font-weight:700;box-shadow:0 6px 0 color-mix(in srgb,var(--c) 60%,#000)}
#modes{gap:22px}
#modes .mw{width:350px;padding:14px;gap:9px;border-radius:38px;border:4px solid var(--b);background:linear-gradient(#fff,var(--t));box-shadow:0 10px 0 var(--bs),0 24px 40px var(--sh);transition:transform .15s}
#modes .mw:active{transform:translateY(6px);box-shadow:0 4px 0 var(--bs),0 12px 24px var(--sh)}
.mw.s,#msc.s{--t:#e6efff;--b:#bcd2ff;--bs:#9bb8f4;--sh:#2f6bff33;--k:#1f4fd8}
.mw.g,#msc.g{--t:#ffeceb;--b:#ffc3be;--bs:#eea29b;--sh:#ff4d4d33;--k:#d62f2f}
.ch{display:flex;flex-direction:column;align-items:center;line-height:1}
.ch b{font-size:34px;font-weight:700;color:var(--k);letter-spacing:1px}
.ch span{font-size:19px;color:#5a6a8f;margin-top:4px;font-weight:500}
.pv{width:100%;height:auto;display:block;border-radius:28px;background:radial-gradient(circle at 50% 50%,#fff 55%,var(--t));box-shadow:inset 0 0 0 3px var(--b)}
.pup{display:flex;gap:10px}
.pup i{font-style:normal;width:36px;height:36px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:0 3px 8px #0002}
#modes .cap{width:100%;text-align:center;padding:10px 0;font-size:28px}
.ring{position:absolute;inset:24px;border-radius:50%;border:12px solid transparent;background:conic-gradient(#22d3ee,#2f6bff,#a21cff,#ff4fd8,#ffb300,#22c55e,#22d3ee) border-box;-webkit-mask:linear-gradient(#000 0 0) padding-box exclude,linear-gradient(#000 0 0);mask:linear-gradient(#000 0 0) padding-box exclude,linear-gradient(#000 0 0)}
.orbit{position:absolute;inset:0;animation:spin 18s linear infinite}
.orbit span{position:absolute;left:50%;top:50%;width:68px;height:68px;margin:-34px 0 0 -34px}
.orbit.r{animation-direction:reverse}
.ring.g{background:conic-gradient(#ff4d4d,#ff9a3d,#ffd23f,#ff4d4d,#a0102a,#ff4d4d) border-box}
.orbit img{width:100%;height:100%;border-radius:50%;border:4px solid #fff;box-shadow:0 8px 18px #0003}
@keyframes spin{to{transform:rotate(360deg)}}
#splash{position:absolute;inset:0;z-index:50;background:#ff3d9a;color:#fff;overflow:hidden;animation:spOut .6s ease 5.4s forwards}
#spc{position:absolute;inset:0;width:100%;height:100%}
.sp-glow{position:absolute;left:50%;top:50%;width:640px;height:440px;margin:-220px 0 0 -320px;background:radial-gradient(closest-side,#ff3d9af2 60%,#ff3d9a00);opacity:0;animation:spIn .8s ease 1.4s forwards}
.sp-title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.sp-row{display:flex;font-size:132px;font-weight:700;line-height:1;overflow:hidden;padding:0 10px 14px;margin-bottom:-6px;text-shadow:0 8px 0 #c21d6b}
.sp-row span{display:inline-block;transform:translateY(125%);animation:spLet .75s cubic-bezier(.2,.9,.2,1.1) forwards;animation-delay:calc(1.6s + var(--i)*.08s)}
.sp-tag{position:absolute;left:0;right:0;top:50%;margin-top:150px;text-align:center;font-size:32px;font-weight:600;letter-spacing:10px;opacity:0;transform:translateY(12px);animation:spTag .8s ease 3.2s forwards}
.sp-bar{position:absolute;left:50%;bottom:70px;width:420px;height:12px;margin-left:-210px;border-radius:8px;background:#ffffff40;overflow:hidden}
.sp-bar b{display:block;height:100%;width:0;background:#fff;border-radius:8px;animation:spBar 4.4s cubic-bezier(.5,0,.3,1) .9s forwards}
@keyframes spLet{to{transform:none}}
@keyframes spIn{to{opacity:1}}
@keyframes spTag{to{opacity:.95;transform:none}}
@keyframes spBar{to{width:100%}}
@keyframes spOut{to{opacity:0;visibility:hidden}}
.mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:66px;font-weight:700;line-height:.9;color:#2f6bff}
.mid.g{color:#ff4d4d;gap:4px}
.mid small{font-size:21px;font-weight:500;color:#5a6a8f}
#levels{z-index:6;background:#fff;display:flex;flex-direction:column;padding:26px 50px}
#levels h2{margin:0 0 14px;text-align:center;font-size:48px}
#lg{flex:1;display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:1fr;gap:14px}
.lc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:28px;background:linear-gradient(#f2f6ff,#dfeaff);border:3px solid #cdd8f5;box-shadow:0 6px 0 #cdd8f5;font-weight:600}
.lc:active{transform:translateY(4px)}
.lc b{font-size:48px;line-height:1;color:#2f6bff}.lc span{font-size:20px}
.lc i{font-style:normal;font-size:30px;color:#ffb300;letter-spacing:3px}
.lc.lock{filter:grayscale(1);opacity:.55;pointer-events:none}
#endbox{z-index:7;background:#ffffffe8;backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#et{margin:0;font-size:60px}#es{font-size:80px;color:#ffb300;letter-spacing:8px;line-height:1}
#sheet{z-index:6;background:#fff;display:flex;flex-direction:column;padding:26px 50px 26px}
#sheet.hide{transform:translateY(40px)}
#sheet h2{margin:0 0 12px;text-align:center;font-size:44px}
#grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:12px;padding:6px}
.f{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 2px;font-size:20px;font-weight:600;border-radius:24px;background:#f2f6ff;position:relative}
.f img{width:72px;height:72px;border-radius:50%;box-shadow:0 4px 10px #0003}
.f.sel{background:#dfeaff;outline:4px solid #2f6bff}
.f.sel::after{content:attr(data-o);position:absolute;top:4px;right:10px;background:#2f6bff;color:#fff;border-radius:50%;width:32px;height:32px;line-height:32px;text-align:center;font-size:18px;font-weight:700}
#sh{display:flex;align-items:center;gap:20px;margin:0 0 12px}
#sh h2{margin:0;flex:1;text-align:left;font-size:34px;white-space:nowrap}
#q{width:440px;font:600 26px "Fredoka",system-ui,sans-serif;padding:12px 22px;border-radius:30px;border:3px solid #cdd8f5;background:#f2f6ff;color:#1b2a4a;outline:none;-webkit-user-select:text;user-select:text}
#q:focus{border-color:#2f6bff;background:#fff}
#none{display:none;text-align:center;font-size:30px;color:#5a6a8f;padding:40px}
.f span{text-align:center;line-height:1.1;font-size:17px;word-break:break-word;max-width:100%}
#mb{display:flex;gap:20px;justify-content:center;margin-top:14px}
#mb .cta,#mb .opt{width:360px;margin:0}
</style></head>

   if(Math.hypot(q.x-b.x,q.y-b.y)<BR+10){const dmg=Math.round(rnd(9,16));b.hp-=dmg;b.hit=.18;q.dead=1;spark(S,q.x,q.y,q.o.col,8);S.fl.push({x:b.x+rnd(-14,14),y:b.y-BR-34,t:0,txt:'-'+dmg,col:'#ff3b3b'});S.score+=10;
    if(b.hp<=0){b.alive=false;b.dead=1.6;S.score+=100;spark(S,b.x,b.y,b.col,24);S.rg.push({x:b.x,y:b.y,t:0,col:b.col});S.fl.push({x:b.x,y:b.y-20,t:0,txt:'OUT!',col:b.col})}
    break}}
  if(Math.hypot(q.x-CX,q.y-CY)>RR||q.l>2)q.dead=1}
 S.bul=S.bul.filter(q=>!q.dead)}
function puStep(S,dt){
 if(!S.pu){S.puT-=dt;if(S.puT<=0){const a=rnd(0,TAU),d=rnd(40,170);S.pu={x:CX+Math.cos(a)*d,y:CY+Math.sin(a)*d,t:0}}return}
 S.pu.t+=dt;
 for(const b of S.balls){if(!b.alive||Math.hypot(b.x-S.pu.x,b.y-S.pu.y)>BR+28)continue;
  let txt='+HEAL!';if(S.mode==='g')b.hp=Math.min(100,b.hp+35);else{txt='+STRINGS!';for(let k=0;k<6;k++)b.anc.push(mkA(b.cl,0))}
  S.rg.push({x:S.pu.x,y:S.pu.y,t:0,col:'#ff3d81'});spark(S,S.pu.x,S.pu.y,'#ff3d81',12);S.fl.push({x:S.pu.x,y:S.pu.y-34,t:0,txt,col:'#ff3d81'});S.pu=null;S.puT=rnd(4,6);break}}
function fxStep(S,dt){
 for(const p of S.pt){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.93;p.vy*=.93}S.pt=S.pt.filter(p=>p.t<p.l);
 for(const e of S.fl)e.t+=dt;S.fl=S.fl.filter(e=>e.t<1);
 for(const e of S.rg)e.t+=dt;S.rg=S.rg.filter(e=>e.t<.6);
 for(const e of S.cuts)e.t+=dt;S.cuts=S.cuts.filter(e=>e.t<.45);
 S.shown+=(S.score-S.shown)*Math.min(1,dt*6)}
function arena(c){
 c.clearRect(0,0,W,H);
 const g=c.createRadialGradient(CX,CY,RR*.2,CX,CY,RR+14);g.addColorStop(0,'#fff');g.addColorStop(1,'#e9f1ff');
 c.save();c.shadowColor='#1456e833';c.shadowBlur=26;c.shadowOffsetY=8;c.fillStyle=g;c.beginPath();c.arc(CX,CY,RR+14,0,TAU);c.fill();c.restore();
 const o=T*.14;for(let i=0;i<24;i++){c.strokeStyle=SEG[i%6];c.lineWidth=18;c.beginPath();c.arc(CX,CY,RR+6,o+i*Math.PI/12,o+(i+1)*Math.PI/12+.012);c.stroke()}}
function ball(c,b,me){
 const r=BR*(b.pop<1?(b.pop*(2.2-1.2*b.pop)):1),x=b.x,y=b.y,col=b.col,rim=r*.24;
 c.save();c.shadowColor=col;c.shadowBlur=22;const g=c.createRadialGradient(x-r*.3,y-r*.4,r*.2,x,y,r+rim);g.addColorStop(0,'#fff');g.addColorStop(.3,col);g.addColorStop(1,col);c.fillStyle=g;c.beginPath();c.arc(x,y,r+rim,0,TAU);c.fill();c.restore();
 c.save();c.translate(x,y);c.beginPath();c.arc(0,0,r,0,TAU);c.clip();
 const im=mimg(b.f);if(im.complete&&im.naturalWidth)c.drawImage(im,-r,-r,r*2,r*2);else{c.fillStyle=col;c.fillRect(-r,-r,r*2,r*2)}
 const ux=b.lx,uy=b.ly,bl=Math.sin(T*2.3+b.sd*5)>.985;
 for(const sx of[-1,1]){const ex=sx*r*.3,ey=-r*.06;c.fillStyle='#fff';c.strokeStyle='#0003';c.lineWidth=2;c.beginPath();c.ellipse(ex,ey,r*.21,bl?r*.04:r*.27,0,0,TAU);c.fill();c.stroke();if(!bl){c.fillStyle='#111';c.beginPath();c.arc(ex+ux*r*.09,ey+uy*r*.11,r*.11,0,TAU);c.fill();c.fillStyle='#fff';c.beginPath();c.arc(ex+ux*r*.09+r*.04,ey+uy*r*.11-r*.04,r*.04,0,TAU);c.fill()}}
 c.strokeStyle='#1b2a4a';c.lineWidth=r*.07;c.lineCap='round';c.beginPath();c.arc(0,r*.2,r*.2,.25,Math.PI-.25);c.stroke();
 const gl=c.createLinearGradient(0,-r,0,0);gl.addColorStop(0,'#ffffffb0');gl.addColorStop(1,'#ffffff00');c.fillStyle=gl;c.beginPath();c.ellipse(0,-r*.55,r*.78,r*.4,0,0,TAU);c.fill();
 if(b.hit>0){c.fillStyle='rgba(255,255,255,'+Math.min(.75,b.hit*5)+')';c.fillRect(-r,-r,r*2,r*2)}
 c.restore();c.strokeStyle='#fff';c.lineWidth=3;c.beginPath();c.arc(x,y,r,0,TAU);c.stroke();
 if(me){c.save();c.strokeStyle=col;c.setLineDash([8,8]);c.lineDashOffset=-T*14;c.lineWidth=4;c.beginPath();c.arc(x,y,r+rim+11,0,TAU);c.stroke();c.restore()}}
function gun(c,b){
 const r=BR,x0=r*.55-b.rc*r*.22,L=r*1.35,h=r*.3,col=b.col;
 c.save();c.translate(b.x,b.y);c.rotate(b.ga);if(Math.abs(b.ga)>Math.PI/2){}
 c.fillStyle='#1d212b';c.beginPath();c.moveTo(x0+r*.1,0);c.lineTo(x0+r*.55,0);c.lineTo(x0+r*.4,r*.55);c.lineTo(x0+r*.05,r*.55);c.closePath();c.fill();
 c.fillStyle='#2d3340';c.strokeStyle='#fff';c.lineWidth=2.5;c.beginPath();c.rect(x0,-h/2,L,h);c.fill();c.stroke();
 c.fillStyle='#5b6478';c.fillRect(x0,-h/2,L,h*.28);c.fillStyle=col;c.fillRect(x0+L*.12,-h/2,r*.1,h);
 if(b.fl>0){const tx=x0+L+r*.1,k=b.fl/.1;c.fillStyle='#ffb300';c.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4,q=(i%2?r*.2:r*.62)*(.6+.4*k);c.lineTo(tx+Math.cos(a)*q,Math.sin(a)*q)}c.closePath();c.fill();c.fillStyle='#fff';c.beginPath();c.arc(tx,0,r*.16,0,TAU);c.fill()}
 c.restore()}
function rr(c,x,y,w,h,r){c.beginPath();if(c.roundRect)c.roundRect(x,y,w,h,r);else c.rect(x,y,w,h)}
function hud(c,S){
 const gm=S.mode==='g';
 S.balls.forEach((b,i)=>{const x=48+(i%2)*64,y=50+(i>>1)*70,col=b.col,fr=gm?clamp(b.hp/100,0,1):clamp(b.anc.length/15,0,1);
  c.save();c.globalAlpha=b.alive?1:.35;c.shadowColor=col;c.shadowBlur=10;c.fillStyle='#fff';c.beginPath();c.arc(x,y,27,0,TAU);c.fill();c.restore();
  c.save();c.globalAlpha=b.alive?1:.35;c.beginPath();c.arc(x,y,23,0,TAU);c.clip();const im=mimg(b.f);if(im.complete&&im.naturalWidth)c.drawImage(im,x-23,y-23,46,46);c.restore();
  c.save();c.globalAlpha=b.alive?1:.35;c.strokeStyle=col;c.lineWidth=5;c.beginPath();c.arc(x,y,25,0,TAU);c.stroke();
  c.fillStyle='#e3e8f5';rr(c,x-24,y+33,48,7,4);c.fill();c.fillStyle=gm&&fr<.35?'#ff3b3b':col;rr(c,x-24,y+33,Math.max(6,48*fr),7,4);c.fill();c.restore()});
 const g=c.createLinearGradient(0,16,0,76);if(gm){g.addColorStop(0,'#ff7a7a');g.addColorStop(1,'#e23232')}else{g.addColorStop(0,'#3d8cff');g.addColorStop(1,'#1456e8')}
 c.save();c.shadowColor=gm?'#e2323255':'#1456e855';c.shadowBlur=14;c.shadowOffsetY=6;c.fillStyle=g;rr(c,470,16,234,60,30);c.fill();c.restore();
 c.fillStyle='#ffffff55';rr(c,480,20,214,10,5);c.fill();
 c.textBaseline='middle';c.textAlign='left';c.fillStyle='#fff';c.font='700 20px Fredoka,system-ui,sans-serif';c.fillText('SCORE',494,47);
 c.textAlign='right';c.fillStyle='#ffe135';c.font='700 36px Fredoka,system-ui,sans-serif';c.fillText(String(Math.round(S.shown)),690,48)}
function draw(S,c){
 arena(c);const gm=S.mode==='g';
 if(S.pu){const s=1+.12*Math.sin(S.pu.t*8),r=26*s,p=S.pu;c.save();c.shadowColor='#ff3d81';c.shadowBlur=22;c.fillStyle='#fff';c.strokeStyle='#ff3d81';c.lineWidth=5;c.beginPath();c.arc(p.x,p.y,r,0,TAU);c.fill();c.stroke();c.restore();c.font=(r*1.1)+'px system-ui';c.textAlign='center';c.textBaseline='middle';c.fillText('💖',p.x,p.y+2)}
 if(!gm){
  for(const b of S.balls){if(!b.alive)continue;c.save();c.strokeStyle=b.col;c.shadowColor=b.col;c.shadowBlur=9;c.lineWidth=2.8;c.globalAlpha=.9;c.beginPath();for(const q of b.anc){const ax=CX+Math.cos(q.a)*q.r*(RR-6),ay=CY+Math.sin(q.a)*q.r*(RR-6);c.moveTo(b.x,b.y);c.lineTo(b.x+(ax-b.x)*q.g,b.y+(ay-b.y)*q.g)}c.stroke();c.restore()}
  for(const k of S.cuts){const f=k.t/.45,dx=(k.x2-k.x1),dy=(k.y2-k.y1);c.save();c.globalAlpha=1-f;c.strokeStyle=k.col;c.shadowColor='#fff';c.shadowBlur=12;c.lineWidth=4.5;c.lineCap='round';c.beginPath();c.moveTo(k.x1+dx*f*.35,k.y1+dy*f*.35);c.lineTo(k.x2,k.y2);c.stroke();c.restore()}}
 S.balls.forEach((b,i)=>{if(b.alive){ball(c,b,i===0);if(gm)gun(c,b)}});
 if(gm){for(const b of S.balls){if(!b.alive)continue;const w=100,y=b.y-BR-30;c.fillStyle='#0003';rr(c,b.x-w/2,y,w,9,5);c.fill();c.fillStyle=b.hp>35?b.col:'#ff3b3b';rr(c,b.x-w/2,y,Math.max(0,w*b.hp/100),9,5);c.fill()}
  for(const q of S.bul){const col=q.o.col;c.save();c.lineCap='round';c.strokeStyle=col;c.shadowColor=col;c.shadowBlur=12;c.lineWidth=8;c.beginPath();c.moveTo(q.x-q.vx*.055,q.y-q.vy*.055);c.lineTo(q.x,q.y);c.stroke();c.fillStyle='#fff';c.beginPath();c.arc(q.x,q.y,5.5,0,TAU);c.fill();c.restore()}}
 for(const e of S.rg){c.save();c.globalAlpha=1-e.t/.6;c.strokeStyle=e.col;c.lineWidth=10;c.beginPath();c.arc(e.x,e.y,e.t*150,0,TAU);c.stroke();c.restore()}
 for(const p of S.pt){c.globalAlpha=Math.max(0,1-p.t/p.l);c.fillStyle=p.c;c.beginPath();c.arc(p.x,p.y,p.r,0,TAU);c.fill()}c.globalAlpha=1;
 for(const e of S.fl){c.save();c.globalAlpha=Math.min(1,(1-e.t)*2);c.font=FONT;c.textAlign='center';c.textBaseline='middle';const y=e.y-e.t*46;if(e.txt!=='✂️'){c.lineWidth=7;c.strokeStyle='#fff';c.lineJoin='round';c.strokeText(e.txt,e.x,y);c.fillStyle=e.col;c.fillText(e.txt,e.x,y)}else{c.font='40px system-ui';c.fillText(e.txt,e.x,y)}c.restore()}
 hud(c,S)}
function tick(now){
 const dt=Math.min((now-last)/1000,.05);last=now;
 if(SIM.length&&!$('home').classList.contains('hide')&&!document.hidden){
  T+=dt;SIM.forEach((S,i)=>{move(S,dt);if(S.mode==='s')stringStep(S,dt);else gunStep(S,dt);puStep(S,dt);fxStep(S,dt);draw(S,cx[i]);if(i===(mm==='gun'?1:0)&&!$('msc').classList.contains('hide'))draw(S,cx3)})}
 requestAnimationFrame(tick)}
window.miniSet=()=>{SIM=[mk('s'),mk('g')]};
miniSet();requestAnimationFrame(t=>{last=t;tick(t)});
})();
paintMenu();requestAnimationFrame(loop);

// Splash intro (6s)
(()=>{
const sp=document.getElementById('splash'),cv=document.getElementById('spc'),g=cv.getContext('2d');
sp.querySelectorAll('.sp-row').forEach(r=>{const o=+(r.dataset.o||0);r.innerHTML=[...r.dataset.t].map((c,i)=>`<span style="--i:${i+o}">${c}</span>`).join('')});
const CX=640,CY=360,R=300,BR=18,N=28,SPD=430,cl=(v)=>Math.max(0,Math.min(1,v));
const balls=[[-130,70,.5],[150,-50,2.5],[0,160,4.4]].map(([dx,dy,a])=>({x:CX+dx,y:CY+dy,vx:Math.cos(a)*SPD,vy:Math.sin(a)*SPD,pts:[]}));
let st=0,t0=0,raf=0;
const end=()=>{cancelAnimationFrame(raf);sp.remove()};
sp.addEventListener('pointerdown',end);setTimeout(end,6100);
function step(dt){for(const b of balls){b.x+=b.vx*dt;b.y+=b.vy*dt;const dx=b.x-CX,dy=b.y-CY,d=Math.hypot(dx,dy);if(d>R-BR-8){const nx=dx/d,ny=dy/d,dot=b.vx*nx+b.vy*ny;b.vx-=2*dot*nx;b.vy-=2*dot*ny;b.x=CX+nx*(R-BR-8);b.y=CY+ny*(R-BR-8);b.pts.push([CX+nx*R,CY+ny*R]);if(b.pts.length>40)b.pts.shift()}}}
function draw(t){
 g.setTransform(2,0,0,2,0,0);g.clearRect(0,0,1280,720);g.lineCap='round';
 // ring segments pop in
 g.lineWidth=14;const seg=Math.PI*2/N;
 for(let i=0;i<N;i++){const p=cl((t-i*.035)/.25);if(!p)continue;g.globalAlpha=p;g.strokeStyle='#fff';g.beginPath();g.arc(CX,CY,R,-Math.PI/2+i*seg+seg*.08,-Math.PI/2+(i+1)*seg-seg*.08);g.stroke()}
 // strings + balls
 const bp=cl((t-.9)/.35);
 g.globalAlpha=bp*.55;g.strokeStyle='#fff';g.lineWidth=2;
 for(const b of balls){g.beginPath();for(const q of b.pts){g.moveTo(b.x,b.y);g.lineTo(q[0],q[1])}g.stroke()}
 g.globalAlpha=bp;
 for(const b of balls){const r=BR*(1+(1-bp)*.8);g.shadowColor='#ffffff99';g.shadowBlur=18;g.fillStyle='#fff';g.beginPath();g.arc(b.x,b.y,r,0,7);g.fill();g.shadowBlur=0;g.fillStyle='#c21d6b';g.beginPath();g.arc(b.x-5,b.y-3,3.4,0,7);g.arc(b.x+5,b.y-3,3.4,0,7);g.fill()}
 g.globalAlpha=1}
function loop(now){if(!t0)t0=now;const t=(now-t0)/1000;while(st<t){st+=1/120;if(st>=.9)step(1/120)}draw(t);if(sp.isConnected)raf=requestAnimationFrame(loop)}
raf=requestAnimationFrame(loop);
})();
</script>
